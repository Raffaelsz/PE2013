name: Gerar APK PES 2013 Android v1.5.1 DEV

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -e

          if [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle.kts não encontrado na raiz."
            exit 1
          fi

          if [ ! -f build.gradle.kts ]; then
            echo "::error::build.gradle.kts não encontrado na raiz."
            exit 1
          fi

          if [ ! -f app/build.gradle.kts ]; then
            echo "::error::app/build.gradle.kts não encontrado."
            exit 1
          fi

          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "::error::AndroidManifest.xml não encontrado."
            exit 1
          fi

          echo "Arquivos principais encontrados."

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::O APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: PES2013-Android-v1.5.1-DEV
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
